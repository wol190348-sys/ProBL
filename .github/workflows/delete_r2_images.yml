name: Delete R2 / S3 Images

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "Which object store to delete images from"
        required: true
        type: choice
        options:
          - r2
          - s3
          - both
        default: both
      execute:
        description: "Actually delete images (off = dry-run preview only)"
        required: false
        type: boolean
        default: false
      confirm:
        description: 'Type DELETE to confirm when execute is on'
        required: false
        type: string
        default: ""

jobs:
  delete-images:
    name: Delete Bleems images (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ inputs.backend == 'both' && fromJSON('["r2","s3"]') || fromJSON(format('["{0}"]', inputs.backend)) }}

    env:
      CF_R2_ACCESS_KEY_ID:     ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      CF_R2_ENDPOINT_URL:      ${{ secrets.CF_R2_ENDPOINT_URL }}
      CF_R2_BUCKET_NAME:       ${{ secrets.CF_R2_BUCKET_NAME }}
      AWS_ACCESS_KEY_ID:       ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:   ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:      us-east-1
      S3_BUCKET_NAME:          ${{ secrets.S3_BUCKET_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade --cache-dir ~/.cache/pip -r requirements.txt

      - name: Confirm deletion
        if: ${{ inputs.execute }}
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo "execute is on, but confirm is not DELETE — aborting."
            echo "Re-run with execute enabled and confirm set to DELETE."
            exit 1
          fi

      - name: Delete ${{ matrix.backend }} images
        run: |
          if [ "${{ inputs.execute }}" = "true" ]; then
            python CF/delete_r2_images.py --backend "${{ matrix.backend }}" --execute
          else
            python CF/delete_r2_images.py --backend "${{ matrix.backend }}"
          fi
